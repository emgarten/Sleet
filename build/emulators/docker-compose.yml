# Storage emulators for running the functional tests without a cloud account.
#
#   docker compose -f build/emulators/docker-compose.yml up -d
#   ./build.sh --use-dev-storage   (or ./build.ps1 -UseDevStorage)
#   docker compose -f build/emulators/docker-compose.yml down

name: sleet-emulators

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # Blob only and in memory. Skip the API version check so newer Azure SDK versions work with this Azurite version.
    command: azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
