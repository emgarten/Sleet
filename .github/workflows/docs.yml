# Build the documentation site and deploy it to GitHub Pages
# Pages must be configured to deploy from GitHub Actions: Settings > Pages > Source

name: Docs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'doc/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: doc/requirements.txt
    - name: Install MkDocs
      run: pip install -r doc/requirements.txt
    - name: Build site
      run: mkdocs build --strict
    - name: Upload site
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:

    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
