# Runs the emulator functional tests for pull requests from forks and Dependabot. They can't use the repository
# secrets for the cloud tests, so functional.yml skips them. See CONTRIBUTING.md#functional-tests
#
# A maintainer can run the cloud tests for one of these pull requests with functional-manual.yml.

name: Functional Tests (emulators only)

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  emulators:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'

    # Docker runs Linux containers on the Linux runners only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Functional tests
      if: matrix.shell == 'bash'
      run: ./functional-tests.sh
      shell: bash
    - name: Functional tests
      if: matrix.shell == 'pwsh'
      run: ./functional-tests.ps1
      shell: pwsh
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-emulators-${{ matrix.shell }}
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
