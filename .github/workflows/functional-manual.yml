# Runs the jobs from functional.yml for a pull request, including the cloud tests with the repository secrets.
# Use this for pull requests from forks and Dependabot, which functional.yml skips. Review the changes first,
# because this runs the pull request code with the secrets.

name: Functional Tests (manual dispatch, with secrets)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run functional tests for"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  emulators:
    name: emulators (${{ matrix.script }})

    # Docker runs Linux containers on the Linux runners only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - script: bash
            run: ./functional-tests.sh
          - script: pwsh
            run: pwsh -NoProfile -File ./functional-tests.ps1

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Functional tests
        run: ${{ matrix.run }}
        shell: bash

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-emulators-${{ matrix.script }}
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

  cloud:
    name: cloud (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run: ./functional-tests.sh --target cloud
          - os: macos-latest
            run: ./functional-tests.sh --target cloud
          - os: windows-latest
            run: pwsh -NoProfile -File ./functional-tests.ps1 -Target cloud

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Functional tests
        run: ${{ matrix.run }}
        shell: bash
        env:
          SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-cloud-${{ matrix.os }}
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7
