name: Functional Tests (manual dispatch, with secrets)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run functional tests for"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: ./build.sh
        shell: bash
        env:
          SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: us-east-1
          CIBUILD: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-linux
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: ./build.sh
        shell: bash
        env:
          SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: us-east-1
          CIBUILD: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-mac
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: pwsh
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          Write-Host "PR: #$env:PR_NUMBER"
          Write-Host "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: ./build.ps1
        shell: pwsh
        env:
          SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: us-east-1
          CIBUILD: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-win
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7
