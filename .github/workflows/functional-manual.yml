# Runs the jobs from functional.yml for a pull request, including the cloud tests with the repository secrets.
# Use this for pull requests from forks and Dependabot, which functional.yml skips. Review the changes first,
# because this runs the pull request code with the secrets.

name: Functional Tests (manual dispatch, with secrets)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run functional tests for"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  emulators:
    # Docker runs Linux containers on the Linux runners only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Functional tests
        if: matrix.shell == 'bash'
        run: ./functional-tests.sh
        shell: bash

      - name: Functional tests
        if: matrix.shell == 'pwsh'
        run: ./functional-tests.ps1
        shell: pwsh

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-emulators-${{ matrix.shell }}
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7

  cloud:
    # Linux only, the same as the emulator tests, to keep the usage of the test accounts low
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Check out the PR's head commit (works for fork PRs too)
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Show checked out ref
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "PR: #$PR_NUMBER"
          echo "SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Functional tests
        run: ./functional-tests.sh --target cloud
        shell: bash
        env:
          SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
          SLEET_TEST_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SLEET_TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SLEET_TEST_S3_REGION: us-east-1
          SLEET_TEST_R2_ACCESS_KEY_ID: ${{ secrets.SLEET_TEST_R2_ACCESS_KEY_ID }}
          SLEET_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.SLEET_TEST_R2_SECRET_ACCESS_KEY }}
          SLEET_TEST_R2_SERVICE_URL: ${{ secrets.SLEET_TEST_R2_SERVICE_URL }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-results-cloud
          path: artifacts/TestResults
          if-no-files-found: ignore
          retention-days: 7
