# Runs the functional tests the same way as a local run, see CONTRIBUTING.md#functional-tests
#
# The emulator tests run against the local test environment in local-env, and the cloud tests run against the test
# accounts in the repository secrets. Pull requests from forks and Dependabot can't use the secrets, so these jobs
# skip them and functional-emulators.yml runs their emulator tests instead. functional-manual.yml runs these jobs
# for one of those pull requests.

name: Functional Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'

permissions:
  contents: read

jobs:
  emulators:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')

    # Docker runs Linux containers on the Linux runners only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Functional tests
      if: matrix.shell == 'bash'
      run: ./functional-tests.sh
      shell: bash
    - name: Functional tests
      if: matrix.shell == 'pwsh'
      run: ./functional-tests.ps1
      shell: pwsh
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-emulators-${{ matrix.shell }}
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7

  cloud:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Functional tests
      if: runner.os != 'Windows'
      run: ./functional-tests.sh --target cloud
      shell: bash
      env:
        SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
        SLEET_TEST_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        SLEET_TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        SLEET_TEST_S3_REGION: us-east-1
    - name: Functional tests
      if: runner.os == 'Windows'
      run: ./functional-tests.ps1 -Target cloud
      shell: pwsh
      env:
        SLEET_TEST_ACCOUNT: ${{ secrets.SLEET_TEST_ACCOUNT }}
        SLEET_TEST_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        SLEET_TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        SLEET_TEST_S3_REGION: us-east-1
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-cloud-${{ matrix.os }}
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
