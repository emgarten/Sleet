# Runs the emulator functional tests against the local test environment in local-env, the same way as a local run.
# See CONTRIBUTING.md#functional-tests
#
# These tests don't use any secrets, so they run for every pull request, including pull requests from forks and
# Dependabot. functional-cloud.yml runs the cloud tests, which use the repository secrets.

name: Functional Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulators:
    # Docker runs Linux containers on the Linux runners only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shell: [bash, pwsh]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Functional tests
      if: matrix.shell == 'bash'
      run: ./functional-tests.sh
      shell: bash
    - name: Functional tests
      if: matrix.shell == 'pwsh'
      run: ./functional-tests.ps1
      shell: pwsh
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: functional-test-results-emulators-${{ matrix.shell }}
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
