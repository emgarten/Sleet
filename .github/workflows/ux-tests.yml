name: UX Tests

# Browser tests for the gallery that Sleet writes to index.html. These run
# ux-tests.sh and ux-tests.ps1, which use the Chrome or Edge on the runner.

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: UX tests
      run: ./ux-tests.sh
      shell: bash
  test-mac:

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: UX tests
      run: ./ux-tests.sh
      shell: bash
  test-win:

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-tags: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: UX tests
      run: ./ux-tests.ps1
      shell: pwsh
