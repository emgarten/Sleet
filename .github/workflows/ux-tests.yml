name: UX Tests

# Browser tests for the gallery that Sleet writes to index.html. These run
# ux-tests.sh and ux-tests.ps1, which use the Chrome or Edge on the runner.

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-linux:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: UX tests
      run: ./ux-tests.sh
      shell: bash
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ux-test-results-linux
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
  test-mac:

    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: UX tests
      run: ./ux-tests.sh
      shell: bash
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ux-test-results-mac
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
  test-win:

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: UX tests
      run: ./ux-tests.ps1
      shell: pwsh
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ux-test-results-win
        path: artifacts/TestResults
        if-no-files-found: ignore
        retention-days: 7
