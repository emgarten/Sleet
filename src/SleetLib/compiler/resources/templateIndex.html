<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NuGet feed</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0;
  --accent:#0969da; --chip:#eef2f5; --card:#ffffff; --danger:#d1242f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d;
    --accent:#4493f8; --chip:#212830; --card:#151b23; --danger:#f85149;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;
  flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:1}
h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
#search{flex:1;min-width:220px;padding:7px 11px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--fg);font-size:14px}
#search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
main{max-width:1000px;margin:0 auto;padding:20px}
.meta{color:var(--muted);font-size:12px;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.source{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--chip);border:1px solid var(--line);border-radius:6px;
  padding:8px 12px;margin:0 0 16px;font-size:12px;color:var(--muted)}
.source code{color:var(--fg);word-break:break-all}
.pkg{border:1px solid var(--line);border-radius:6px;background:var(--card);
  padding:14px 16px;margin-bottom:10px}
.pkg-head{display:flex;gap:12px;align-items:flex-start}
.icon{width:36px;height:36px;border-radius:6px;flex:none;background:var(--chip);object-fit:contain}
.grow{flex:1;min-width:0}
.pkg-title{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.pkg-id{font-size:15px;font-weight:600;color:var(--accent);text-decoration:none}
.pkg-id:hover{text-decoration:underline}
.ver{font-size:12px;color:var(--muted)}
.desc{margin:6px 0 0}
.tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
.sub{margin-top:6px;font-size:12px;color:var(--muted)}
details{margin-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--muted);width:max-content}
summary:hover{color:var(--accent)}
table{border-collapse:collapse;margin-top:8px;width:100%;font-size:13px}
td{padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
td:first-child{white-space:nowrap}
a{color:var(--accent)}
.empty{color:var(--muted);padding:48px 0;text-align:center}
.err{border:1px solid var(--danger);border-radius:6px;padding:12px 14px}
.err p{margin:6px 0 0;color:var(--muted);font-size:13px}
footer{max-width:1000px;margin:0 auto;padding:8px 20px 32px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>NuGet feed</h1>
  <input id="search" type="search" placeholder="Search by id, description, tag or author&#8230;" autocomplete="off" autofocus>
  <span class="meta" id="count"></span>
</header>
<main>
  <p class="source">
    <span>Package source</span>
    <code class="mono" id="sourceUrl"></code>
  </p>
  <div id="body"><p class="empty">Loading&#8230;</p></div>
</main>
<footer>Generated by Sleet $SLEETVERSION$</footer>
<script>
(function () {
  "use strict";

  // Resolve the feed root from this page's own location rather than from a
  // baked in base URI. The same file then works unmodified when served from a
  // blob endpoint, an Azure $web endpoint, an S3 website endpoint, CloudFront
  // or an R2 custom domain, and every request stays same origin so no CORS
  // configuration is ever required.
  var ROOT = (function () {
    var href = location.href.split("#")[0].split("?")[0];
    href = href.replace(/(^|\/)index\.html?$/i, "$1");
    return href.charAt(href.length - 1) === "/" ? href : href + "/";
  })();

  var elBody = document.getElementById("body");
  var elCount = document.getElementById("count");
  var elSearch = document.getElementById("search");
  document.getElementById("sourceUrl").textContent = ROOT + "index.json";

  var packages = [];

  function getJson(path) {
    return fetch(ROOT + path, { headers: { accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("GET " + path + " failed with status " + r.status);
        return r.json();
      });
  }

  function text(v) { return typeof v === "string" ? v : ""; }

  // Package metadata comes from nuspec files, so urls in it are untrusted.
  // Only http and https are allowed through to prevent a published package
  // from injecting a javascript: or data: url into the page.
  function safeUrl(v) {
    var raw = text(v).trim();
    if (!raw) return "";

    try {
      var parsed = new URL(raw, ROOT);
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
      return parsed.href;
    } catch (e) {
      return "";
    }
  }

  function list(v) {
    if (Array.isArray(v)) {
      return v.map(text).map(function (x) { return x.trim(); }).filter(Boolean);
    }
    return text(v).split(",").map(function (x) { return x.trim(); }).filter(Boolean);
  }

  // Newest first. Numeric release parts descend, and a release version sorts
  // ahead of any prerelease of that same release.
  function compareVersions(a, b) {
    var sa = a.split("+")[0].split("-"), sb = b.split("+")[0].split("-");
    var na = sa[0].split("."), nb = sb[0].split(".");
    for (var i = 0; i < Math.max(na.length, nb.length); i++) {
      var d = (parseInt(nb[i], 10) || 0) - (parseInt(na[i], 10) || 0);
      if (d) return d;
    }
    var pa = sa.slice(1).join("-"), pb = sb.slice(1).join("-");
    if (!pa && !pb) return 0;
    if (!pa) return -1;
    if (!pb) return 1;
    return pb < pa ? -1 : pb > pa ? 1 : 0;
  }

  function nupkgUrl(id, version) {
    var i = id.toLowerCase(), v = version.toLowerCase();
    return ROOT + "flatcontainer/" + encodeURIComponent(i) + "/" + encodeURIComponent(v) +
      "/" + encodeURIComponent(i + "." + v + ".nupkg");
  }

  // search/query holds full metadata for every package in the feed.
  function fromSearch(json) {
    return (json.data || []).map(function (e) {
      var versions = (e.versions || []).map(function (v) { return text(v.version); })
        .filter(Boolean).sort(compareVersions);
      return {
        id: text(e.id),
        latest: text(e.version) || versions[0] || "",
        title: text(e.title),
        description: text(e.description) || text(e.summary),
        iconUrl: safeUrl(e.iconUrl),
        projectUrl: safeUrl(e.projectUrl),
        licenseUrl: safeUrl(e.licenseUrl),
        tags: list(e.tags),
        authors: list(e.authors),
        versions: versions
      };
    });
  }

  // sleet.packageindex.json carries only ids and versions, but it is always
  // present and stays correct when externalsearch points search off feed.
  function fromPackageIndex(json) {
    var src = (json && json.packages) || {};
    return Object.keys(src).map(function (id) {
      var versions = list(src[id]).sort(compareVersions);
      return {
        id: id, latest: versions[0] || "", title: "", description: "",
        iconUrl: "", projectUrl: "", licenseUrl: "",
        tags: [], authors: [], versions: versions
      };
    });
  }

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function link(href, txt, cls) {
    var a = el("a", cls, txt);
    a.href = href;
    return a;
  }

  function card(p) {
    var box = el("div", "pkg");
    var head = el("div", "pkg-head");

    if (p.iconUrl) {
      var img = el("img", "icon");
      img.src = p.iconUrl;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = function () { img.remove(); };
      head.appendChild(img);
    }

    var col = el("div", "grow");

    var title = el("div", "pkg-title");
    title.appendChild(p.latest
      ? link(nupkgUrl(p.id, p.latest), p.id, "pkg-id")
      : el("span", "pkg-id", p.id));
    if (p.latest) title.appendChild(el("span", "ver mono", p.latest));
    if (p.title && p.title !== p.id) title.appendChild(el("span", "meta", p.title));
    col.appendChild(title);

    if (p.description) col.appendChild(el("p", "desc", p.description));
    if (p.authors.length) col.appendChild(el("div", "sub", "by " + p.authors.join(", ")));

    if (p.tags.length) {
      var tags = el("div", "tags");
      p.tags.forEach(function (t) { tags.appendChild(el("span", "tag", t)); });
      col.appendChild(tags);
    }

    var links = el("div", "sub");
    if (p.projectUrl) links.appendChild(link(p.projectUrl, "Project"));
    if (p.projectUrl && p.licenseUrl) links.appendChild(document.createTextNode(" \u00b7 "));
    if (p.licenseUrl) links.appendChild(link(p.licenseUrl, "License"));
    if (links.childNodes.length) col.appendChild(links);

    var det = el("details");
    det.appendChild(el("summary", null,
      p.versions.length + (p.versions.length === 1 ? " version" : " versions")));
    var table = el("table");
    p.versions.forEach(function (v) {
      var row = el("tr");
      row.appendChild(el("td", "mono", v));
      var cell = el("td");
      cell.appendChild(link(nupkgUrl(p.id, v), "download .nupkg"));
      row.appendChild(cell);
      table.appendChild(row);
    });
    det.appendChild(table);
    col.appendChild(det);

    head.appendChild(col);
    box.appendChild(head);
    return box;
  }

  function render(items) {
    elCount.textContent = items.length === packages.length
      ? packages.length + (packages.length === 1 ? " package" : " packages")
      : items.length + " of " + packages.length + " packages";

    elBody.textContent = "";

    if (!items.length) {
      elBody.appendChild(el("p", "empty",
        packages.length ? "No packages match this search." : "This feed has no packages yet."));
      return;
    }

    var frag = document.createDocumentFragment();
    items.forEach(function (p) { frag.appendChild(card(p)); });
    elBody.appendChild(frag);
  }

  function applyFilter() {
    var q = elSearch.value.trim().toLowerCase();
    if (!q) return render(packages);

    var terms = q.split(/\s+/);
    render(packages.filter(function (p) {
      return terms.every(function (t) { return p.search.indexOf(t) !== -1; });
    }));
  }

  function start(items) {
    packages = items.filter(function (p) { return p.id; })
      .sort(function (a, b) {
        var x = a.id.toLowerCase(), y = b.id.toLowerCase();
        return x < y ? -1 : x > y ? 1 : 0;
      });

    packages.forEach(function (p) {
      p.search = [p.id, p.title, p.description, p.tags.join(" "), p.authors.join(" ")]
        .join(" ").toLowerCase();
    });

    applyFilter();
  }

  function fail(err) {
    elCount.textContent = "";
    elBody.textContent = "";
    var box = el("div", "err");
    box.appendChild(el("strong", null, "Unable to read this feed."));
    box.appendChild(el("p", null, String((err && err.message) || err)));
    box.appendChild(el("p", null,
      "Check that the feed files are publicly readable from " + ROOT + "."));
    elBody.appendChild(box);
  }

  elSearch.addEventListener("input", applyFilter);

  getJson("search/query")
    .then(function (json) { start(fromSearch(json)); })
    .catch(function () {
      return getJson("sleet.packageindex.json").then(function (json) {
        start(fromPackageIndex(json));
      });
    })
    .catch(fail);
})();
</script>
</body>
</html>
